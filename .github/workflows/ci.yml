name: CI

# `verify` is the package's whole Linux gate in the pinned swift:6.2.4 image: format, lint,
# the Foundation-only import rule, the Package.resolved guard, the tests, a floor on how
# many ran, and the coverage floors. `hygiene`, `gitleaks` and `zizmor` are what a public
# repository owes its readers: no dashes, internal host names or GitLab URLs, the licence
# files, no secrets anywhere in the history, and workflows that pass static analysis.
# `darwin` builds the package with Xcode for iOS and macOS, the two platforms its
# consumers ship on. `dependency graph` submits the Package.resolved pins to GitHub's
# dependency graph, which does not read that file itself.
#
# No job reads a secret, so pull requests from forks run the same checks as `main`
# (all but `dependency graph`, which needs a token that can write).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_darwin:
        description: Run the macOS job on this dispatch (needed only if the repository is private)
        type: boolean
        default: false

# Least privilege at the top level, so a job added later starts read-only.
permissions:
  contents: read

# Per ref and per trigger. Only pull requests cancel in flight: a superseded PR run is
# waste, a superseded main run is history. A manual dispatch gets its own group, so a push
# arriving behind a pending dispatch cannot cancel it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-24.04
    # ⚠️ PINNED BY TAG AND DIGEST, the same reference as ci/Dockerfile. `6.2.4` is
    # rebuilt when its Ubuntu base gets a security update, so the tag alone moves. The
    # Linux toolchain is paired with the Xcode the apps build with (Swift 6.2): a Linux
    # compiler ahead of Xcode's compiles code the apps then reject. Move both together,
    # or neither.
    container: swift:6.2.4@sha256:29b983751c605c2d3102d2ab93438c6e0cadf110d9d2aa6e929b6dec9dcb7cbc
    timeout-minutes: 30
    env:
      # Same versions, URLs and SHA-256 sums as ci/Dockerfile. Bump both together.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
      SWIFTFORMAT_VERSION: 0.63.0
      SWIFTFORMAT_SHA256: b4a3cbb8c852a0baaf9adf853e221ff1dabf921a3d8957a602e0bda3af8470f1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python3 is for ci/coverage-gate.sh and the Package.resolved guard. libxml2 is for
      # the dynamic SwiftLint binary, which otherwise dies at startup on a missing
      # libxml2.so.2.
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git python3 libxml2
          rm -rf /var/lib/apt/lists/*

      # ⛔ THE DYNAMIC `swiftlint`, NOT THE `swiftlint-static` BESIDE IT IN THE ZIP. The
      # static build has SourceKit compiled out, skips every rule that needs it with a
      # warning, and still reports "0 violations". The dynamic build loads sourcekitd
      # from the Swift toolchain in this image and runs the full rule set.
      # The checksum is what tells the real archive from a redirect page or a
      # substituted asset; an unredirected curl can save HTML and exit 0.
      - name: Install SwiftLint and SwiftFormat
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | sha256sum -c -
          unzip -q swiftlint.zip -d swiftlint-extract
          install -m 0755 swiftlint-extract/swiftlint /usr/local/bin/swiftlint
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | sha256sum -c -
          unzip -q swiftformat.zip -d swiftformat-extract
          install -m 0755 swiftformat-extract/swiftformat_linux /usr/local/bin/swiftformat
          rm -rf swiftlint.zip swiftlint-extract swiftformat.zip swiftformat-extract

      # Prove the toolchain before doing work, so a wrong image fails with the reason
      # rather than with a confusing compiler error later.
      - name: Toolchain
        run: |
          swift --version
          swiftlint version
          swiftformat --version
          python3 --version
          llvm-cov --version | head -n 1

      # `--lint` writes nothing and exits non-zero on any file that would change.
      - name: swiftformat --lint
        run: swiftformat --lint .

      # `--strict` promotes every warning to an error. A warning tier in CI is a tier
      # nobody reads.
      - name: swiftlint --strict
        run: swiftlint --strict

      # ⛔ THE PACKAGE MUST STAY LINUX-BUILDABLE, AND NOTHING ELSE ENFORCES THIS. Those
      # frameworks belong in the apps behind protocols declared here. It greps the SOURCES
      # rather than relying on the build: an import inside `#if canImport(...)` compiles
      # clean on Linux and still means the type exists only on Darwin, where the Linux
      # tests silently stop covering it.
      - name: The package imports no Darwin-only framework
        run: |
          banned=$(grep -rnE '^[[:space:]]*(@testable[[:space:]]+)?import[[:space:]]+(UIKit|SwiftUI|Security|AuthenticationServices|CallKit|PushKit|LiveKit|AppKit)\b' Sources Tests || true)
          if [ -n "$banned" ]; then
            echo "FATAL - the package imports a Darwin-only framework:"
            echo "$banned"
            echo "DistrictCore is the Linux-testable core of the apps and must import only"
            echo "Foundation/FoundationNetworking. Put the Darwin type in the app behind a"
            echo "protocol declared here. See Package.swift."
            exit 1
          fi

      # ⛔ XCODE CAN WRITE AN APP'S REMOTE PINS INTO THIS Package.resolved when an app
      # resolves its packages against a local checkout of this one. Committed, it would ask
      # this job to resolve Apple-only binary frameworks it cannot use; this turns that
      # accident into a one-line red instead of a resolve failure that reads like a network
      # problem.
      - name: Package.resolved pins only the package's own dependencies
        run: |
          python3 - <<'PY'
          import json, sys
          allowed = {"swift-crypto", "swift-asn1"}
          pins = {p["identity"] for p in json.load(open("Package.resolved"))["pins"]}
          extra = sorted(pins - allowed)
          if extra:
              print("FATAL - Package.resolved pins packages DistrictCore does not depend on:")
              print("  " + ", ".join(extra))
              print("Xcode wrote an app's remote pins into this package's resolved file.")
              print("Run: git checkout -- Package.resolved  (never commit that write).")
              sys.exit(1)
          print("Package.resolved pins only " + ", ".join(sorted(pins)))
          PY

      # Keyed on the toolchain as well as the lockfile: build products from another
      # compiler are not reusable.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: districtcore-build-swift-6.2.4-${{ hashFiles('Package.resolved') }}

      # ⚠️ A RESTORED CACHE CAN CARRY AN EARLIER RUN'S COVERAGE EXPORT, and
      # ci/coverage-gate.sh falls back to searching .build for one. Deleting it first
      # means the only export the gate can find is the one this run writes.
      - name: swift test
        run: |
          if [ -d .build ]; then find .build -type d -name codecov -prune -exec rm -rf {} +; fi
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tee swift-test.log

      # ⛔ PROVE THE TESTS ACTUALLY RAN, AND NOT FEWER OF THEM THAN LAST TIME. An XCTest
      # bundle that discovers nothing exits 0, the same shape as a skipped suite reporting
      # green, and a test target dropped from Package.swift loses hundreds of tests with
      # no other failure. The floor is a ratchet, set a little below the count (1828 on
      # 2026-10-03; about 1759 after the recording removal, which deleted 71 tests with
      # the retired recording, storage, notetaker, booking notes and transcript surfaces
      # and added 2; about 1867 with the Voice Studio's 108; 2013 with the live
      # transcript's 99): raise it when tests are added, and lower it only in the commit
      # that deletes tests on purpose, saying so.
      - name: Tests were discovered
        run: |
          minimum=1980
          executed=$(sed -n 's/.*Executed \([0-9]*\) test.*/\1/p' swift-test.log | sort -n | tail -1)
          echo "unit tests executed - ${executed:-0} (at least $minimum expected)"
          if [ -z "$executed" ] || [ "$executed" -lt "$minimum" ]; then
            echo "FATAL - expected at least $minimum unit tests, saw ${executed:-0}. A bundle"
            echo "that discovers nothing, or a test target that is no longer built, reports"
            echo "success, so this is a silent loss of coverage, not a pass."
            exit 1
          fi

      # ⛔ THE FLOORS ARE ENFORCED HERE AND NOWHERE ELSE. SwiftPM has no coverage
      # threshold of its own; the script fails on missing coverage data rather than
      # treating it as nothing to check.
      - name: Coverage floors
        run: ci/coverage-gate.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: warn
          retention-days: 7

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the scan, so that a rule which has stopped matching anything fails here
      # instead of letting the scan pass quietly.
      - name: The public-hygiene rules still catch what they claim to
        run: python3 scripts/check-public-hygiene.py --self-test

      - name: Public hygiene (dashes, internal host names, GitLab URLs)
        run: python3 scripts/check-public-hygiene.py

      # The licence the README and every consumer rely on, and the NOTICE that carries
      # the copyright line and the trademark terms. Checked by content, because an empty
      # or replaced file passes an existence check.
      - name: LICENSE is Apache 2.0, and NOTICE carries the copyright and trademark terms
        run: |
          set -euo pipefail
          grep -q 'Apache License' LICENSE
          grep -q 'Version 2.0, January 2004' LICENSE
          grep -q 'Copyright 2026 Distronode Corporation' NOTICE
          grep -q 'Apache License, Version 2.0' NOTICE
          grep -q 'trademarks of Distronode Corporation' NOTICE
          echo "LICENSE and NOTICE are in place"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip

      # gitleaks/gitleaks-action needs a paid GITLEAKS_LICENSE for an organization
      # repository. The CLI itself is free (MIT), so install a pinned version and run it.
      # `go install` of a tagged module is checked against the Go checksum database.
      # `.gitleaks.toml` is picked up from the root.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # `--log-opts="HEAD"`: the history reachable from this checkout only. A full-depth
      # checkout also fetches every other branch, and without it one open pull request's
      # finding reds every other pull request's run. A push to main still scans all of main.
      - name: gitleaks git
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact -v --log-opts="HEAD" .

  # Static analysis of these workflows: template injection, over-broad token permissions,
  # credential persistence, cache poisoning, unpinned actions. Suppressions are inline
  # `# zizmor: ignore[...]` comments with a reason.
  #
  # Annotations mode, not SARIF: zizmor reports a finding as an annotation and FAILS the
  # job, on pushes and pull requests alike, rather than only filing a code scanning alert.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  darwin:
    name: darwin (macOS)
    # Runs on every push and pull request. This guard and the run_darwin input matter only
    # if the repository is ever private again: the free plan bills a private repository's
    # macOS minutes at ten times the Linux rate, and everything this job can catch that
    # `verify` cannot is a Darwin-only compile error, so there this job runs only when
    # started by hand (workflow_dispatch with run_darwin).
    if: ${{ !github.event.repository.private || (github.event_name == 'workflow_dispatch' && inputs.run_darwin) }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Recommended by xcbeautify: without it xcodebuild buffers its output when piped.
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ⚠️ Xcode 26.3, not the image default: the Xcode district-ios archives with, which
      # ships Swift 6.2, the toolchain `verify` pins on Linux. Asserted rather than
      # trusted, so an image rotation that drops it fails here, naming the reason.
      - name: Select Xcode
        env:
          XCODE_APP: /Applications/Xcode_26.3.app
          XCODE_VERSION: "26.3"
        run: |
          sudo xcode-select -s "$XCODE_APP"
          # Not `| head -n 1`: under pipefail with unbuffered output, xcodebuild aborts on
          # the closed pipe (exit 134). Read everything, keep the first line.
          have_all="$(xcodebuild -version)"
          have="${have_all%%$'\n'*}"
          echo "$have"
          if [ "$have" != "Xcode $XCODE_VERSION" ]; then
            echo "::error::expected Xcode $XCODE_VERSION at $XCODE_APP, got '$have'"
            exit 1
          fi
          sw_vers
          uname -m
          swift --version

      # The same tests as `verify`, against Darwin Foundation and URLSession rather than
      # corelibs-foundation, which differ in places the Linux run cannot see.
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test-darwin.log

      # ⛔ `generic/platform=...` BUILDS AGAINST THE SDK WITHOUT A DEVICE OR SIMULATOR, and
      # `CODE_SIGNING_ALLOWED=NO` lets it run with no Apple account. `DistrictCore-Package`
      # is the scheme SwiftPM generates for a package with more than one product: every
      # library target, built for the platform named. The raw log is grepped because a
      # piped xcodebuild can exit 0 on a build that did not finish.
      - name: xcodebuild for iOS and macOS
        run: |
          set -o pipefail
          for platform in iOS macOS; do
            echo "=== generic/platform=$platform ==="
            xcodebuild build \
              -scheme DistrictCore-Package \
              -destination "generic/platform=$platform" \
              -derivedDataPath DerivedData \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "xcodebuild-$platform.log" | xcbeautify --renderer github-actions
            grep -q '\*\* BUILD SUCCEEDED \*\*' "xcodebuild-$platform.log"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: darwin-logs
          path: |
            swift-test-darwin.log
            xcodebuild-*.log
          if-no-files-found: warn
          retention-days: 7

  # ⛔ GITHUB'S DEPENDENCY GRAPH DOES NOT READ THIS Package.resolved (format v3), so without
  # this job it holds the workflow actions only, and "0 Dependabot alerts" means no Swift
  # package was looked at. This submits the pins as a snapshot through the dependency
  # submission API: each one as `pkg:swift/github.com/<owner>/<repo>@<version>`, the name
  # the GitHub Advisory Database files Swift advisories under. `dependency-review` runs
  # after it, to compare a pull request against `main`.
  # Push to main and pull requests from this repository only: a fork's pull request gets
  # no token that can write a snapshot. The only job with a write permission, and it
  # reads nothing but the two committed files.
  dependency-graph:
    name: dependency graph
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dependency-graph/snapshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submit the Swift package snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED: Package.resolved
          MANIFEST: Package.swift
          SOURCE: Package.resolved
          CORRELATOR: swiftpm-package-resolved
          # A pull request's snapshot belongs to its head commit, which is what
          # dependency-review compares; GITHUB_SHA there is the test merge commit.
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, sys

          def identity(url):
              return url.rstrip("/").removesuffix(".git").rsplit("/", 1)[-1].lower()

          pins = json.load(open(os.environ["RESOLVED"]))["pins"]
          spec = open(os.environ["MANIFEST"]).read()
          direct = {identity(u) for u in re.findall(r'\burl:\s*"?(https://[^\s",)]+)', spec)}
          resolved = {}
          for pin in pins:
              state = pin.get("state", {})
              version = state.get("version") or state.get("revision")
              m = re.fullmatch(r"https://([^/]+)/(.+?)(?:\.git)?/?", pin.get("location", ""))
              if pin.get("kind") != "remoteSourceControl" or not m or not version:
                  print(f"::warning::{pin['identity']} not submitted: no remote URL and version")
                  continue
              purl = f"pkg:swift/{m.group(1).lower()}/{m.group(2)}@{version}"
              relationship = "direct" if pin["identity"] in direct else "indirect"
              resolved[pin["identity"]] = {"package_url": purl, "relationship": relationship, "scope": "runtime"}
              print(f"{purl} ({relationship})")
          missing = sorted(direct - resolved.keys())
          if not resolved or missing:
              print(f"FATAL - {os.environ['RESOLVED']} does not pin every package {os.environ['MANIFEST']} names: {missing}")
              sys.exit(1)
          server, repo, run = os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
          source = os.environ["SOURCE"]
          snapshot = {
              "version": 0,
              "job": {"id": run, "correlator": os.environ["CORRELATOR"], "html_url": f"{server}/{repo}/actions/runs/{run}"},
              "sha": os.environ["SNAPSHOT_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "detector": {"name": "swiftpm-package-resolved", "version": "1.0.0", "url": f"{server}/{repo}/blob/main/.github/workflows/ci.yml"},
              "scanned": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "manifests": {source: {"name": source, "file": {"source_location": source}, "resolved": resolved}},
          }
          json.dump(snapshot, open(os.path.join(os.environ["RUNNER_TEMP"], "snapshot.json"), "w"), indent=2)
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/snapshot.json" >"$RUNNER_TEMP/response.json"
          cat "$RUNNER_TEMP/response.json"
          echo
          # ACCEPTED or SUCCESS; INVALID means the graph kept the previous snapshot.
          jq -e '.result != "INVALID"' "$RUNNER_TEMP/response.json" >/dev/null

  # Pull requests only: fails a pull request that ADDS a dependency (a Swift package from
  # the snapshot above, or an action) with a known moderate-or-worse vulnerability, or
  # under a licence this Apache-2.0 package cannot ship. Mostly a guard on Dependabot's own pull
  # requests. The same action, pin and deny-list as bridgewatch's and district-linux's
  # `dependency-review` job. It compares the two sides through the dependency graph API,
  # so it checks nothing out.
  # ⛔ IT RUNS AFTER `dependency graph`, NOT BESIDE IT. The compare API caches its answer
  # per query: a review that asks before this pull request's snapshot lands is told "No
  # snapshots were found for the head SHA" for as long as it asks (measured past 25
  # minutes after the snapshot landed), so `retry-on-snapshot-warnings` never sees it and
  # the Swift changes go unreviewed. Asked after the submission, the first answer is the
  # right one (district-android's dependency-submission.yml has the same rule).
  # ⛔ AND ONLY AFTER A SUBMISSION THAT SUCCEEDED. After a failed or cancelled one this
  # review would pass without the Swift packages, a gate that looks green without having
  # looked; it is skipped instead, and the red submission is the signal. On a fork's pull
  # request no snapshot can come (`dependency graph` is skipped there), so the review runs
  # on what GitHub reads by itself (the workflows' actions) and does not wait. Skipped
  # while the repository is private, where dependency review needs GitHub Code Security.
  dependency-review:
    name: dependency-review
    needs: dependency-graph
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      !github.event.repository.private &&
      (needs.dependency-graph.result == 'success' ||
      (needs.dependency-graph.result == 'skipped' &&
      github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The retry is a backstop for a snapshot GitHub has not finished storing, not the way
      # the two jobs are ordered (see above). A run whose log ends in "Retry timeout
      # exceeded" has NOT reviewed the Swift packages: re-run that job.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          retry-on-snapshot-warnings-timeout: 300
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
