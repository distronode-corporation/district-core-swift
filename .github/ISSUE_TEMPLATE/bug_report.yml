name: 🐞 Bug report
description: Report a reproducible bug in the shared Swift core, or in building or testing it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-core-swift/issues?q=is%3Aissue):** it may already be reported or fixed.

        ⛔ **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/district-core-swift/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/district-core-swift/blob/main/SECURITY.md).

        ⚠️ **Nothing you paste here is private.** Logs and responses from a signed-in app can show caller names, phone numbers, messages and workspace names. Redact anything you would not publish, and never paste a token or a session.

        A problem you see in the app (a screen, a call, a notification) and cannot trace to this package belongs in the app's repository, such as [district-ios](https://github.com/distronode-corporation/district-ios/issues). Questions about an account, a phone number or billing go to [District AI support](https://www.distronode.com/support).
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release, or the latest `main`.
          required: true
        - label: This is not a security issue (those go to the private report linked above).
          required: true
        - label: I've removed every token and every piece of customer or caller data from what I'm pasting.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, a failing test, or the request and response that go wrong.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - DistrictModel (decoding a response)
        - DistrictAuthCore (sign-in, tokens, sign-out)
        - DistrictNetwork (requests, endpoints, errors)
        - DistrictData (repositories, paging)
        - DistrictCall (call state machines)
        - Contract fixtures or the contract gate
        - Building, testing or CI
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "1.0.0, or a commit SHA"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and toolchain
      placeholder: "macOS 15, Xcode 26.3; or Ubuntu 24.04, swift 6.2.4"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Build or test output, if relevant. Read it before pasting.
      render: text
