name: CodeQL Swift

# The Swift half of code scanning, in ADVANCED setup: traced through a `swift build` of
# every library target on macOS. The workflow files are analysed by codeql.yml.
#
# The `!github.event.repository.private` guard matters only if the repository is ever
# private again: code scanning is not available to a private repository on the free plan,
# so the upload would fail. `schedule` carries `repository` in its payload too, so the
# weekly run is guarded the same way.
#
# ⛔ NOT ON PULL REQUESTS, AND ON MAIN ONLY WHEN THE SWIFT THAT IS BUILT CHANGES. The free
# plan runs at most five macOS jobs at once for the whole organisation, and the apps' CI
# and release lanes queue behind them. Tests/ is not built by `swift build`, and a
# workflow-only commit changes nothing the extractor reads, so neither starts a scan:
# dispatch this workflow to prove a change to it.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
  schedule:
    # Weekly, so new queries in a CodeQL release reach code that has not changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Nothing at the top level; the job below asks for exactly what it uses.
permissions: {}

jobs:
  swift:
    name: Analyze (swift)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 120
    # One scan running and at most one waiting per ref; the running one is never cancelled.
    concurrency:
      group: codeql-swift-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      security-events: write # upload the results
      contents: read # check out the code
      actions: read # read this run's workflow details
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Xcode as ci.yml's `darwin` job, asserted.
      - name: Select Xcode
        env:
          XCODE_APP: /Applications/Xcode_26.3.app
          XCODE_VERSION: "26.3"
        run: |
          sudo xcode-select -s "$XCODE_APP"
          have_all="$(xcodebuild -version)"
          have="${have_all%%$'\n'*}"
          echo "$have"
          if [ "$have" != "Xcode $XCODE_VERSION" ]; then
            echo "::error::expected Xcode $XCODE_VERSION at $XCODE_APP, got '$have'"
            exit 1
          fi

      # Fetches the pinned packages and evaluates their manifests before the tracer is
      # attached. Under it, resolution took about 11 of the scan's 18 minutes (2026-10-06,
      # job 112117259986: 8 minutes silent, then 2.7 minutes computing swift-crypto), and
      # none of it is compilation the extractor reads.
      - name: Resolve packages
        run: swift package resolve

      # Every step after this one is traced, so the setup above stays out of it.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      # The library targets only (no test bundles), as GitHub's Swift autobuilder does.
      # `-j 1` for the reason district-ios's codeql-swift.yml documents: the tracer runs the
      # extractor beside every frontend, and in parallel the pairs outgrow the runner.
      - name: swift build
        run: swift build -j 1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:swift"
