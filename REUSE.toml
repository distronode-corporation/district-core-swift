# REUSE metadata (https://reuse.software) for files that cannot carry a comment header:
# JSON, Markdown, images, Package.resolved and NOTICE; contracts/ and tools/l10n/, copied unchanged and pinned by their SHA256SUMS; the l10n catalogs, which l10n.py requires in canonical form; and the files scripts/gen-l10n.py generates (--check compares them byte for byte). Every other file carries its own SPDX header,
# and `reuse lint` in CI fails when one is missing.
version = 1

[[annotations]]
path = [
  "**/*.json",
  "**/*.md",
  "**/*.png",
  "Package.resolved",
  "NOTICE",
  "contracts/**",
  "tools/l10n/**",
  "l10n/*.toml",
  "Sources/DistrictL10n/Generated/**",
  "Tests/DistrictL10nTests/Generated/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Distronode Corporation"
SPDX-License-Identifier = "Apache-2.0"
