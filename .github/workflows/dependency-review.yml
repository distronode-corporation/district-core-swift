name: Dependency review

# Pull requests only: fails a pull request that ADDS a dependency (a Swift package or an
# action) with a known moderate-or-worse vulnerability, or under a licence this
# Apache-2.0 package cannot ship. Mostly a guard on Dependabot's own pull requests. The
# same job as district-linux's and bridgewatch's `dependency-review`, as its own workflow
# because this package has no other pull-request-only job to sit beside.
on:
  pull_request:

# Read-only: the action reads the dependency graph diff and the repository contents.
permissions:
  contents: read

# Per pull request; a superseded review is waste.
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ⚠️ THE SWIFT PACKAGES REACH THE GRAPH ONLY THROUGH ci.yml's `dependency graph` job,
      # which submits a snapshot for this pull request's head commit. Until it lands the
      # comparison carries a snapshot warning and sees no Swift change, so the action
      # retries every 10 seconds for up to 8 minutes, then proceeds with what it has.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 480
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
